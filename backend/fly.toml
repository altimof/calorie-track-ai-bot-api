app = 'calorize-me-bot'
primary_region = 'lax'

[build]
  dockerfile = 'Dockerfile'

[env]
  USE_WEBHOOK = 'true'
  WEBHOOK_URL = 'https://calorize-me-bot.fly.dev/bot'
  ENABLE_WORKER = 'true'

[[services]]
  protocol = 'tcp'
  internal_port = 8080
  auto_start_machines = true
  auto_stop_machines = 'suspend'
  min_machines_running = 0

  [[services.ports]]
    port = 80
    handlers = ['http']

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'requests'
    hard_limit = 50
    soft_limit = 25

  [[services.http_checks]]
    interval = "5s"
    timeout = "2s"
    method = "GET"
    path = "/healthz"
    protocol = "http"
    tls_skip_verify = false
    grace_period = "8s"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
